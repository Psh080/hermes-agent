services:
  gateway:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    volumes:
      - hermes-data:/opt/data
      - hermes-agent-src:/opt/hermes
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-false}
    command: ["gateway", "run"]

  webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - hermes-data:/.hermes
      - hermes-agent-src:/opt/hermes-agent:ro
    environment:
      - WANTED_UID=10000
      - WANTED_GID=10000
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD}
      - HERMES_WEBUI_STATE_DIR=/.hermes/webui
      - HERMES_WEBUI_DEFAULT_WORKSPACE=/.hermes/workspace
      - HERMES_WEBUI_AGENT_DIR=/opt/hermes-agent
      - HERMES_WEBUI_AUTO_INSTALL=1

volumes:
  hermes-data:
  hermes-agent-src:
